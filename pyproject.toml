[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policybench"
version = "0.0.0"
description = "A CLI-first, local-first benchmark for policy compliance in tool-using AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "PolicyBench maintainers" }]
dependencies = [
    "pydantic>=2",
    "typer",
    "httpx",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/Sammy-t3ch/policybench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
