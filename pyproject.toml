[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "policybench"
version = "0.1.0"
description = "A CLI-first, local-first benchmark and evaluation framework for measuring policy compliance in tool-using AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "PolicyBench Contributors" },
]
keywords = ["ai-agents", "benchmark", "evaluation", "policy-compliance", "tool-use"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "httpx",
    "jsonschema",
]

[project.optional-dependencies]
plots = [
    "matplotlib",
]
bootstrap = [
    "numpy",
]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/Sammy-t3ch/policybench"
Issues = "https://github.com/Sammy-t3ch/policybench/issues"
Documentation = "https://github.com/Sammy-t3ch/policybench/tree/main/docs"

[project.scripts]
policybench = "policybench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policybench = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
